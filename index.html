<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>여행 플랜 메모장</title>

    <!-- p5.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/p5@2/lib/p5.min.js"></script>
    <link rel="stylesheet" href="style.css?v=8" />
    <style>
      .transport-options {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 5px;
        margin-top: 8px;
      }
      .transport-option {
        min-width: 0;
        min-height: 58px;
        padding: 7px 2px;
        border: 1px solid #d9dde3;
        border-radius: 12px;
        background: #fff;
        color: #454b55;
        font: inherit;
        font-size: 15px;
        cursor: pointer;
      }
      .transport-option .transport-icon {
        display: block;
        margin-bottom: 3px;
        font-size: 19px;
      }
      .transport-option.active {
        border: 2px solid #656d78;
        background: #e9edf2;
        color: #252a31;
        box-shadow: 0 0 0 1px #656d78 inset;
        font-weight: 700;
      }
      .transport-custom-input {
        margin-top: 15px;
      }
      .transport-custom-input[hidden] {
        display: none;
      }
      @media (max-width: 360px) {
        .transport-options {
          gap: 3px;
        }
        .transport-option {
          padding-inline: 1px;
          font-size: 10px;
        }
        .transport-option .transport-icon {
          font-size: 17px;
        }
      }
    </style>
    <script>
      window.googleMapsRoutesReady = new Promise((resolve, reject) => {
        window.initializeGoogleMapsRoutes = async () => {
          try {
            resolve(await google.maps.importLibrary("routes"));
          } catch (error) {
            reject(error);
          }
        };
        const mapsScript = document.createElement("script");
        mapsScript.src =
          "https://maps.googleapis.com/maps/api/js?key=AIzaSyBOTiwiXA4_9vaF2dnF4ATE8TbvOm6iqkI&loading=async&callback=initializeGoogleMapsRoutes&v=weekly";
        mapsScript.async = true;
        mapsScript.onerror = () =>
          reject(new Error("Google Maps 기능을 불러오지 못했습니다."));
        document.head.appendChild(mapsScript);
      });
    </script>
  </head>
  <body>
    <!-- 커스텀 배경 레이어 -->
    <div class="screen-bg">
      <div class="glow"></div>
      <div class="glow-bottom"></div>
    </div>

    <!-- 상단 UI 영역 -->
    <div id="top-ui">
      <!-- 메인 제목 / 부제목 (수정 9: Glassmorphism 적용, '기준 장소' 버튼 삭제) -->
      <header id="main-header">
        <div
          class="title-box"
          id="title-box-btn"
          title="클릭하여 여행 제목/부제목 수정"
          onclick="startTitleEdit(event)"
        >
          <div class="title-text-group">
            <h1 id="header-main-title">나의 여행 (1)</h1>
            <p id="header-sub-title">부제목을 설정할 수 있습니다.</p>
          </div>
          <div class="title-logo" aria-label="Pikpin 로고" role="img">
            <svg width="27" height="20" viewBox="0 0 27 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <svg width="43.2" height="32" viewBox="0 0 27 20" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M0.549752 17.7536V11.7063H3.30696C4.51642 11.7063 5.32836 12.3153 5.32836 13.5839C5.32836 14.8526 4.46567 15.4531 3.24776 15.4531H1.81841V17.7536H0.549752ZM3.08706 14.3959C3.6791 14.3959 4.01741 14.1591 4.01741 13.5839C4.01741 12.9919 3.6791 12.7635 3.08706 12.7635H1.81841V14.3959H3.08706ZM5.85723 17.7536V13.4317H7.01593V17.7536H5.85723ZM5.84031 12.8227V11.7317H7.04131V12.8227H5.84031ZM7.97502 17.7536V11.7063H9.24368V14.4974L11.7049 11.7063H13.0919L10.7745 14.2944L13.2695 17.7536H11.781L10.0133 15.1571L9.24368 16.0113V17.7536H7.97502ZM13.6658 17.7536V11.7063H16.423C17.6325 11.7063 18.4444 12.3153 18.4444 13.5839C18.4444 14.8526 17.5817 15.4531 16.3638 15.4531H14.9345V17.7536H13.6658ZM16.2031 14.3959C16.7952 14.3959 17.1335 14.1591 17.1335 13.5839C17.1335 12.9919 16.7952 12.7635 16.2031 12.7635H14.9345V14.3959H16.2031ZM18.9733 17.7536V13.4317H20.132V17.7536H18.9733ZM18.9564 12.8227V11.7317H20.1574V12.8227H18.9564ZM21.0911 17.7536V11.7063H22.3851L24.8548 15.7491H24.8717V11.7063H26.115V17.7536H24.8209L22.3597 13.7108H22.3428V17.7536H21.0911Z" fill="#6B6D72"/>
              <path d="M0.000001 1.96974C0.000163 0.881973 0.881957 0.000132 1.96973 0.000009C3.0576 0.000009 3.93929 0.881898 3.93945 1.96974C3.93945 2.99086 3.16294 3.83037 2.16797 3.9297V8.40919H1.77149V3.9297C0.776731 3.83016 0.000001 2.99071 0.000001 1.96974Z" fill="#6B6D72"/>
              <path d="M6.6553 1.97027C6.6553 0.882369 7.53716 0.000666 8.62503 0.000543C9.71301 0.000543 10.5948 0.882293 10.5948 1.97027C10.5946 2.99131 9.81819 3.83093 8.82327 3.93023V8.40875H8.42679V3.93023C7.43208 3.83072 6.65542 2.99116 6.6553 1.97027Z" fill="#6B6D72"/>
              <path d="M23.8395 3.93221C22.8722 3.83545 22.1133 3.03881 22.0719 2.05624C22.0296 3.03806 21.2711 3.83377 20.3043 3.93026V8.40878H19.9078V3.93026C18.9133 3.83063 18.1365 2.99109 18.1364 1.9703C18.1364 0.882495 19.0183 0.000849 20.1061 0.000574C21.1675 0.000574 22.0313 0.839931 22.0729 1.8912C22.1155 0.84097 22.9771 0.002647 24.0377 0.002527C25.1255 0.002772 26.0074 0.884434 26.0074 1.97225C26.0073 2.99314 25.2307 3.83271 24.236 3.93221V8.41073H23.8395V3.93221Z" fill="#6B6D72"/>
              <path d="M11.4814 1.97027C11.4814 0.882372 12.3632 0.00067 13.4511 0.000543C14.5391 0.000543 15.4208 0.882293 15.4208 1.97027C15.4207 2.99131 14.6442 3.83094 13.6493 3.93023V8.40875H13.2528V3.93023C12.2581 3.83072 11.4815 2.99115 11.4814 1.97027Z" fill="#6B6D72"/>
              <path d="M3.93091 5.30132C3.93115 4.54959 4.5405 3.94024 5.29224 3.94C6.04418 3.94 6.6543 4.54944 6.65454 5.30132C6.65454 5.98584 6.14925 6.55172 5.49146 6.648V8.40875H5.094V6.648C4.43616 6.55176 3.93091 5.98587 3.93091 5.30132Z" fill="#6B6D72"/>
              <path d="M15.4123 5.30132C15.4125 4.54959 16.0219 3.94024 16.7736 3.94C17.5255 3.94 18.1357 4.54944 18.1359 5.30132C18.1359 5.98584 17.6306 6.55172 16.9728 6.648V8.40875H16.5753V6.648C15.9175 6.55175 15.4123 5.98587 15.4123 5.30132Z" fill="#6B6D72"/>
            </svg>
          </div>
        </div>
      </header>

      <!-- 1줄: Day 선택(왼쪽) + 핀 추가 버튼(오른쪽) (수정 5: 선 연결 레이어 포함) -->
      <div class="schedule-row">
        <div class="day-bar-wrapper">
          <svg id="day-connecting-lines" class="day-connecting-lines"></svg>
          <div class="day-bar" id="day-bar"></div>
        </div>
        <button id="btn-toggle-sidebar" onclick="toggleSidebar()">
          + 핀 추가하기
        </button>
      </div>

      <!-- 2줄: 카테고리 필터 행 -->
      <div class="layer-bar" id="layer-bar"></div>
    </div>

    <!-- 우측 하단 컨트롤러 -->
    <div id="bottom-controls">
      <div id="view-mode-switch" role="group" aria-label="보기 방식 선택">
        <button
          id="btn-free-view"
          class="view-mode-option active"
          type="button"
          aria-pressed="true"
          onclick="setViewMode(false)"
        >
          자유 배치
        </button>
        <button
          id="btn-distance-view"
          class="view-mode-option"
          type="button"
          aria-pressed="false"
          onclick="setViewMode(true)"
        >
          원형 지도로 정렬
        </button>
      </div>
      <div
        id="distance-route-status"
        class="distance-route-status"
        role="status"
        aria-live="polite"
      ></div>
      <small class="route-attribution">Powered by Google, © 2026</small>
      <div id="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()">+</button>
        <button class="zoom-btn" onclick="zoomOut()">−</button>
      </div>
    </div>

    <!-- 하단 코스 요약 및 타임라인 바 -->
    <div id="summary-bar">
      <div class="summary-content" id="summary-content"></div>
    </div>

    <div id="leg-editor-bar" aria-label="장소 사이 이동 정보">
      <div class="leg-editor-heading">
        <div>
          <strong id="leg-editor-title">장소 사이 이동</strong>
          <small>입력한 내용은 자동 저장됩니다.</small>
        </div>
        <button
          type="button"
          class="btn-close"
          aria-label="닫기"
          onclick="closeLegEditor()"
        >
          ×
        </button>
      </div>
      <button
        type="button"
        onclick="clearLegDetails()"
        style="
          display: block;
          margin: 14px 0 16px;
          padding: 8px 12px;
          border: 1px solid #d9dde3;
          border-radius: 8px;
          background: #fff;
          color: #454b55;
          cursor: pointer;
        "
      >
        이동 정보 지우기
      </button>
      <div class="transport-options" id="leg-transport-options">
        <button
          type="button"
          class="transport-option"
          data-mode="walk"
          aria-pressed="false"
          onclick="selectLegTransport('walk')"
        >
          <span class="transport-icon">🚶</span>도보
        </button>
        <button
          type="button"
          class="transport-option"
          data-mode="car"
          aria-pressed="false"
          onclick="selectLegTransport('car')"
        >
          <span class="transport-icon">🚗</span>자동차
        </button>
        <button
          type="button"
          class="transport-option"
          data-mode="bus"
          aria-pressed="false"
          onclick="selectLegTransport('bus')"
        >
          <span class="transport-icon">🚌</span>버스
        </button>
        <button
          type="button"
          class="transport-option"
          data-mode="subway"
          aria-pressed="false"
          onclick="selectLegTransport('subway')"
        >
          <span class="transport-icon">🚇</span>지하철
        </button>
        <button
          type="button"
          class="transport-option"
          data-mode="other"
          aria-pressed="false"
          onclick="selectLegTransport('other')"
        >
          <span class="transport-icon">✈️</span>기타
        </button>
      </div>
      <input
        type="text"
        id="leg-transport-input"
        class="text-input transport-custom-input"
        placeholder="기차, 비행기, 배 등 입력"
        oninput="saveLegDetails()"
        hidden
      />
      <label class="leg-time-input-label" for="leg-time-input">이동 시간</label>
      <div class="leg-time-input-wrap">
        <input
          type="number"
          id="leg-time-input"
          class="text-input"
          min="1"
          step="1"
          placeholder="분 입력"
          oninput="saveLegDetails()"
        />
        <span>분</span>
      </div>
    </div>

    <!-- Day 삭제/수정 드롭다운 메뉴 -->
    <div id="day-dropdown-menu" class="dropdown-menu">
      <button class="dropdown-item" onclick="onDropdownRename()">
        <span>이름 바꾸기</span>
      </button>
      <div class="dropdown-divider"></div>
      <button class="dropdown-item danger" onclick="onDropdownDelete()">
        <span>Day 삭제</span>
      </button>
    </div>

    <!-- [온보딩 / 숙소 정보 모달] (수정 4: + 숙소 추가 버튼 추가) -->
    <div id="base-modal-overlay">
      <div id="base-modal">
        <div class="modal-header">
          <h3 class="base-modal-title">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z" fill="#1a1a1a" />
            </svg>
            베이스캠프(숙소) 설정
          </h3>
          <div class="modal-header-actions">
            <button
              class="btn-add-new-base"
              onclick="addNewBaseGroup()"
              title="새 숙소 추가"
            >
              + 숙소 추가
            </button>
            <button class="btn-close" onclick="closeBaseModal()">✕</button>
          </div>
        </div>

        <div class="modal-section">
          <div class="base-range-labels">
            <span
              >시작 날짜 <strong id="base-range-start-label">선택</strong></span
            >
            <span
              >종료 날짜 <strong id="base-range-end-label">선택</strong></span
            >
          </div>
          <div
            id="base-day-range"
            class="base-day-range"
            role="group"
            aria-label="숙박 Day 범위"
          ></div>
          <p id="base-range-hint" class="base-range-hint">
            숙박할 날짜를 선택하세요. 당일치기의 경우 하루만 선택하면 됩니다.
          </p>
        </div>

        <div class="modal-section">
          <label>숙소 이름</label>
          <input
            type="text"
            id="input-base-name"
            class="text-input"
            placeholder="예: 제주 릴렉스 호텔"
            oninput="keepBaseModalInputState()"
          />
        </div>

        <div class="modal-section">
          <label>주소</label>
          <input
            type="text"
            id="input-base-address"
            class="text-input"
            placeholder="구글맵 등의 주소를 입력하세요"
            oninput="keepBaseModalInputState()"
          />
          <button class="btn-link-map" onclick="openBaseInGoogleMaps()">
            구글맵에서 열기
          </button>
        </div>

        <div class="modal-section">
          <label>메모</label>
          <textarea
            id="input-base-memo"
            class="text-area-input"
            placeholder="예: 체크인 15:00, 예약번호 1234"
            oninput="keepBaseModalInputState()"
          ></textarea>
        </div>

        <div class="modal-actions">
          <button class="btn-modal-save" onclick="saveBaseModal()">
            베이스캠프 설정 완료
          </button>
        </div>
      </div>
    </div>

    <!-- 상세 메모지 팝업 모달 -->
    <div id="memo-modal-overlay">
      <div id="memo-modal">
        <div class="modal-header">
          <span id="modal-category-badge" class="modal-cat-badge">관광지</span>
          <button class="btn-close" onclick="closeMemoModal()">✕</button>
        </div>

        <div class="modal-section">
          <label for="modal-name-input">핀 이름</label>
          <input
            type="text"
            id="modal-name-input"
            class="text-input"
            placeholder="장소 이름을 입력하세요"
            autocomplete="off"
          />
        </div>
        <div class="modal-section">
          <label>카테고리</label>
          <select
            id="modal-category-select"
            class="text-input"
            onchange="onModalCategoryChange()"
          ></select>
        </div>

        <div class="modal-section">
          <label>방문 일자 (스케줄)</label>
          <select id="modal-day-select" class="text-input"></select>
        </div>

        <div class="modal-section">
          <label>코스 방문 순서</label>
          <input
            type="number"
            id="modal-order-input"
            class="text-input"
            min="1"
            placeholder="순서 입력 시 코스에 포함됩니다"
          />
        </div>

        <div class="modal-section">
          <label>숙소 기준 거리 (km)</label>
          <input
            type="number"
            id="modal-dist-input"
            class="text-input"
            min="0.1"
            step="0.1"
            placeholder="거리 입력 가능"
          />
        </div>

        <div class="modal-section">
          <label>주소 (선택)</label>
          <input type="text" id="modal-address-input" class="text-input" />
          <button class="btn-link-map" onclick="openSpotInGoogleMaps()">
            구글맵에서 열기
          </button>
        </div>

        <div class="modal-section">
          <label>메모지 색상 선택</label>
          <div class="color-picker-group">
            <div
              class="color-chip active"
              style="background: #ffffff"
              onclick="selectModalColor('#FFFFFF', this)"
            ></div>
            <div
              class="color-chip"
              style="background: #fff4b8"
              onclick="selectModalColor('#FFF4B8', this)"
            ></div>
            <div
              class="color-chip"
              style="background: #ffd8e4"
              onclick="selectModalColor('#FFD8E4', this)"
            ></div>
            <div
              class="color-chip"
              style="background: #d2f5e3"
              onclick="selectModalColor('#D2F5E3', this)"
            ></div>
            <div
              class="color-chip"
              style="background: #e5d9ff"
              onclick="selectModalColor('#E5D9FF', this)"
            ></div>
          </div>
        </div>

        <div class="modal-section">
          <label>상세 메모</label>
          <textarea
            id="modal-memo-text"
            placeholder="메모를 입력하세요."
          ></textarea>
        </div>

        <div class="modal-actions">
          <button class="btn-modal-delete" onclick="deleteCurrentSpot()">
            핀 삭제
          </button>
          <button class="btn-modal-save" onclick="saveMemoModal()">
            저장하기
          </button>
        </div>
      </div>
    </div>

    <!-- 우측 입력 사이드바 -->
    <div id="sidebar">
      <div class="sidebar-header">
        <h2>핀 설정하기</h2>
        <button class="btn-close" onclick="toggleSidebar()">✕</button>
      </div>

      <div class="form-section">
        <label>핀 이름</label>
        <input
          type="text"
          id="input-name"
          class="text-input"
          placeholder="예: 성산일출봉"
        />
      </div>

      <div class="form-section">
        <label>주소 (선택)</label>
        <input
          type="text"
          id="input-address"
          class="text-input"
          placeholder="주소를 붙여넣으세요"
        />
        <button
          class="btn-link-map"
          type="button"
          onclick="openNewSpotInGoogleMaps()"
        >
          구글맵에서 검색
        </button>
        <small class="field-hint"
          >숙소 주소와 핀 주소를 입력한 뒤 ‘원형 지도로 정렬’을 누르면 자동
          계산됩니다.</small
        >
      </div>

      <div class="form-section">
        <label>숙소 기준 거리 (km)</label>
        <input
          type="number"
          id="input-dist"
          class="text-input"
          min="0.1"
          step="0.1"
          placeholder="거리를 입력할 수 있습니다"
        />
      </div>

      <div class="form-section">
        <label>카테고리</label>
        <div class="chip-group" id="category-chips"></div>
      </div>

      <div class="form-section">
        <label>방문 일자 (스케줄)</label>
        <div
          class="day-bar sidebar-day-bar"
          id="sidebar-day-bar"
          aria-label="핀 방문 일자 선택"
        ></div>
        <input type="hidden" id="input-day" value="1" />
      </div>

      <div class="form-section">
        <label>메모</label>
        <input
          type="text"
          id="input-memo"
          class="text-input"
          placeholder="예: 예약 필수"
        />
      </div>

      <div class="sidebar-footer">
        <button class="btn-submit" onclick="submitSpotTemplate()">
          지도에 추가하기
        </button>
      </div>
    </div>

    <!-- 터치 및 인라인 이벤트 스크립트 -->
    <script>
      document.addEventListener(
        "touchmove",
        function (e) {
          if (
            e.target.closest("#summary-bar") ||
            e.target.closest("#leg-editor-bar") ||
            e.target.closest("#sidebar") ||
            e.target.closest("#memo-modal-overlay") ||
            e.target.closest("#base-modal-overlay") ||
            e.target.closest("#top-ui")
          )
            return;
          e.preventDefault();
        },
        { passive: false },
      );

      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("open");
      }

      let isEditingTitle = false;

      function startTitleEdit(event) {
        if (event && event.target.closest(".title-logo")) return;
        if (isEditingTitle) return;
        isEditingTitle = true;

        const group = document.querySelector(
          "#title-box-btn .title-text-group",
        );
        group.innerHTML =
          '<input type="text" id="inline-title-input" class="inline-title-input" maxlength="40" placeholder="여행 제목" />' +
          '<input type="text" id="inline-sub-input" class="inline-sub-input" maxlength="80" placeholder="부제목 / 메인 메모" />';

        const titleInput = document.getElementById("inline-title-input");
        const subInput = document.getElementById("inline-sub-input");
        titleInput.value = headerInfo.mainTitle;
        subInput.value = headerInfo.subTitle;

        titleInput.focus();
        titleInput.select();
      }

      function finishTitleEdit(save) {
        if (!isEditingTitle) return;
        isEditingTitle = false;

        const titleInput = document.getElementById("inline-title-input");
        const subInput = document.getElementById("inline-sub-input");

        if (save && titleInput && subInput) {
          headerInfo.mainTitle = titleInput.value.trim();
          headerInfo.subTitle = subInput.value.trim();
          storeItem("myTripHeader", headerInfo);
        }

        const group = document.querySelector(
          "#title-box-btn .title-text-group",
        );
        group.innerHTML =
          '<h1 id="header-main-title"></h1><p id="header-sub-title"></p>';
        updateHeaderUI();
      }

      (function setupTitleEditEvents() {
        const titleBox = document.getElementById("title-box-btn");

        titleBox.addEventListener("keydown", function (e) {
          if (!isEditingTitle || e.isComposing) return;

          if (e.key === "Enter") {
            e.preventDefault();
            if (e.target.id === "inline-title-input") {
              document.getElementById("inline-sub-input").focus();
            } else {
              finishTitleEdit(true);
            }
          } else if (e.key === "Escape") {
            finishTitleEdit(false);
          }
        });

        titleBox.addEventListener("focusout", function (e) {
          if (!isEditingTitle) return;
          if (e.relatedTarget && titleBox.contains(e.relatedTarget)) return;
          finishTitleEdit(true);
        });
      })();
    </script>
    <script src="sketch.js"></script>
  </body>
</html>
